<style>
:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#041f2d;overflow:hidden;font-family:'Lora',Georgia,'Times New Roman',serif;color:var(--murekkep);
  overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100%;max-width:520px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:var(--deniz)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;pointer-events:none}
#hud .rozet{pointer-events:auto;background:rgba(243,227,191,.92);border:2px solid var(--altin);border-radius:999px;padding:5px 12px;font-weight:700;font-size:15px}
#ses{cursor:pointer}
#toast{position:absolute;left:50%;top:auto;bottom:110px;transform:translateX(-50%);z-index:9;background:rgba(243,227,191,.97);border:2px solid var(--altin);

#toast.acik{opacity:1}
#gl{position:absolute;inset:0;z-index:6;display:none}
#gl.acik{display:block}
#gbaslik{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 52px);text-align:center;z-index:7;color:#fff;
  font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none;font-size:14px;padding:0 16px;transition:opacity .8s}
#gbaslik.sol{opacity:0}
#ov{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(4,31,45,.55);overflow:auto}
#ov.acik{display:flex}
.panel{width:100%;max-width:440px;max-height:100%;overflow:auto;background:linear-gradient(160deg,var(--parsomen),var(--parsomen2));

@keyframes gir{from{transform:translateY(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.panel h2{margin:0 0 8px;font-size:22px}
.panel p{margin:8px 0;line-height:1.55;font-size:16.5px}
.konusan{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.avatar{flex:none;width:54px;height:54px;border-radius:50%;background:var(--deniz);border:3px solid var(--altin);display:flex;align-items:center;justify-content:center;font-size:30px}
.ad{font-weight:700;font-size:15px}.rol{font-size:12.5px;opacity:.7}
.btn{display:block;width:100%;margin-top:14px;padding:13px 16px;font:inherit;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(#2f7d5b,#23634a);

.btn.ikinci{background:linear-gradient(#c9962b,#a87a1d);border-color:#7d5a12;box-shadow:0 3px 0 #7d5a12}
.panel.parsomen{
  background:

.muhur{position:absolute;right:18px;top:-22px;width:60px;height:60px;border-radius:50%;

pre.kod{background:#15232b;color:#d6e6ee;padding:12px;border-radius:10px;font:13.5px/1.75 ui-monospace,Consolas,monospace;overflow-x:auto;margin:10px 0;white-space:pre}

.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.grid4 .polaroid{width:100%;margin:0;transform:none}

/* ===================== YARDIMCILAR ===================== */
const $ = s => document.querySelector(s);
const DEV = location.protocol === 'file:' || /^(localhost|127\.)/.test(location.hostname) || /[?&]dev/.test(location.search);
const app = $('#app'), mc = $('#mc'), mx = mc.getContext('2d'), gl = $('#gl'), gx = gl.getContext('2d'), ov = $('#ov');
let DPR = Math.min(window.devicePixelRatio || 1, 2), W = 360, H = 640;

function boyutla(){
  const r = app.getBoundingClientRect(); W = r.width; H = r.height;
  for (const [c, x] of [[mc, mx], [gl, gx], [$('#konfeti'), $('#konfeti').getContext('2d')]]){
    c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); x.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
}
addEventListener('resize', boyutla); boyutla();

let AC = null, sesAcik = true;
function ses(f = 440, d = .12, tip = 'sine', v = .07){
  if (!sesAcik) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = tip; o.frequency.value = f; g.gain.value = v; o.connect(g); g.connect(AC.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d); o.stop(AC.currentTime + d);
  }catch(e){}
}
function darbe(f = 300, d = .12, v = .25, gurultu = .6){   // topa vurma / nal sesi: gürültü + tok vuruş
  if (!sesAcik) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime, n = Math.floor(AC.sampleRate * d), buf = AC.createBuffer(1, n, AC.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    const src = AC.createBufferSource(), lp = AC.createBiquadFilter(), g = AC.createGain();
    src.buffer = buf; lp.type = 'lowpass'; lp.frequency.value = f * 6; g.gain.value = v * gurultu;
    src.connect(lp); lp.connect(g); g.connect(AC.destination); src.start(t0);
    const o = AC.createOscillator(), g2 = AC.createGain();
    o.frequency.setValueAtTime(f, t0); o.frequency.exponentialRampToValueAtTime(f * .4, t0 + d);
    g2.gain.setValueAtTime(v, t0); g2.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(g2); g2.connect(AC.destination); o.start(t0); o.stop(t0 + d + .02);
  }catch(e){}
}

function adaPos(d){ return { x: d.x * W, y: d.y * H }; }

function haritaCiz(dt){
  zaman += dt;
  const g = mx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0a4a66'); g.addColorStop(1, '#0d6a8a');
  mx.fillStyle = g; mx.fillRect(0, 0, W, H);
  // dalgalar
  mx.lineWidth = 2;
  for (let i = 0; i < 16; i++){
    const y = (i + .5) * H / 16, ph = zaman * .9 + i * 1.7;
    mx.strokeStyle = `rgba(255,255,255,${.06 + .04 * Math.sin(ph)})`;
    mx.beginPath();
    for (let x = 0; x <= W; x += 14){ const yy = y + Math.sin(x * .03 + ph) * 4; x ? mx.lineTo(x, yy) : mx.moveTo(x, yy); }
    mx.stroke();
  }
  // rota noktaları
  mx.fillStyle = 'rgba(243,227,191,.35)';
  let onceki = { x: W * .5, y: H * .93 };
  for (const d of DURAKLAR){
    const p = adaPos(d), n = 10;
    for (let k = 1; k < n; k++){ mx.beginPath(); mx.arc(onceki.x + (p.x - onceki.x) * k / n, onceki.y + (p.y - onceki.y) * k / n, 2.4, 0, 7); mx.fill(); }
    onceki = p;
  }
  // adalar
  DURAKLAR.forEach((d, i) => {
    const p = adaPos(d), bitti = i < adim, sira = i === adim;
    const r = d.id === 'fener' ? 34 : 38;
    mx.fillStyle = 'rgba(0,0,0,.18)'; mx.beginPath(); mx.ellipse(p.x + 4, p.y + 10, r + 6, r * .55, 0, 0, 7); mx.fill();
    mx.fillStyle = '#e8d29a'; mx.beginPath(); mx.ellipse(p.x, p.y + 4, r + 4, r * .62, 0, 0, 7); mx.fill();
    mx.fillStyle = bitti ? '#3f9a6f' : '#2f7d5b'; mx.beginPath(); mx.ellipse(p.x, p.y, r, r * .55, 0, 0, 7); mx.fill();
    if (sira){
      const a = .35 + .3 * Math.sin(zaman * 4);
      mx.strokeStyle = `rgba(255,224,138,${a + .3})`; mx.lineWidth = 4;
      mx.beginPath(); mx.ellipse(p.x, p.y, r + 12 + 4 * Math.sin(zaman * 4), (r + 12) * .6, 0, 0, 7); mx.stroke();
    }
    mx.font = '34px serif'; mx.textAlign = 'center'; mx.textBaseline = 'middle';
    mx.fillText(d.ikon, p.x, p.y - 12 - (sira ? 4 * Math.abs(Math.sin(zaman * 4)) : 0));
    mx.font = '700 13px Georgia,serif'; mx.fillStyle = '#fff';
    mx.strokeStyle = 'rgba(0,0,0,.5)'; mx.lineWidth = 3; mx.strokeText(d.ad, p.x, p.y + r * .55 + 18); mx.fillText(d.ad, p.x, p.y + r * .55 + 18);
    if (bitti){ mx.font = '22px serif'; mx.fillText('✅', p.x + r * .8, p.y - r * .5); }
    if (d.id === 'tenis'){ // Soner, sıradan bir denizci
      mx.font = '24px serif'; mx.fillText('🧑‍✈️', p.x - r - 6, p.y + 6 + Math.sin(zaman * 2) * 2);
      
    }
  });
  // gemi
  if (gemi.tx !== null){
    const dx = gemi.tx - gemi.x, dy = gemi.ty - gemi.y, d = Math.hypot(dx, dy), hiz = Math.max(170, H * .3);
    if (d < 4) gemi.tx = null;
    else {
      const s = Math.min(d, hiz * dt);
      gemi.x += dx / d * s; gemi.y += dy / d * s;
      if (Math.abs(dx) > 2) gemi.yon = dx > 0 ? 1 : -1;
      if (!(Math.round(zaman * 30) % 3)) gemi.iz.push({ x: gemi.x - gemi.yon * 14, y: gemi.y + 22, a: 1 });
    }
  }
  for (const z of gemi.iz){ z.a -= dt * .6; mx.fillStyle = `rgba(255,255,255,${Math.max(0, z.a) * .5})`; mx.beginPath(); mx.arc(z.x, z.y, 5 * z.a + 1, 0, 7); mx.fill(); }
  gemi.iz = gemi.iz.filter(z => z.a > 0);
  gemiCiz(mx, gemi.x, gemi.y + Math.sin(zaman * 2.2) * 2.5, gemi.yon, 1);
  mx.font = '700 11px Georgia,serif'; mx.textAlign = 'center'; mx.textBaseline = 'middle'; mx.fillStyle = '#fff'; mx.strokeStyle = 'rgba(0,0,0,.5)'; mx.lineWidth = 3; mx.strokeText(AYAR.gemi, gemi.x, gemi.y + 36); mx.fillText(AYAR.gemi, gemi.x, gemi.y + 36);
  // varış
  if (!sahneAcik && adim < DURAKLAR.length){
    const p = adaPos(DURAKLAR[adim]);
    if (Math.hypot(gemi.x - p.x, gemi.y - p.y) < 52){ gemi.tx = null; sahneAc(adim); }
  }
}

function gemiCiz(c, x, y, yon, s){
  c.save(); c.translate(x, y); c.scale(yon * s, s);
  c.fillStyle = '#7a4a24'; c.beginPath(); c.moveTo(-28, 4); c.lineTo(28, 4); c.lineTo(20, 22); c.lineTo(-20, 22); c.closePath(); c.fill();
  c.fillStyle = '#a86a36'; c.fillRect(-26, 4, 52, 4);
  c.fillStyle = '#5a3a1c'; c.fillRect(-2, -34, 4, 40);
  c.fillStyle = '#fbf4e1'; c.beginPath(); c.moveTo(4, -32); c.lineTo(26, 0); c.lineTo(4, 0); c.closePath(); c.fill();
  c.fillStyle = '#f0e2bd'; c.beginPath(); c.moveTo(-4, -26); c.lineTo(-22, 0); c.lineTo(-4, 0); c.closePath(); c.fill();
  c.fillStyle = '#b23a2e'; c.beginPath(); c.moveTo(-2, -34); c.lineTo(-16, -30); c.lineTo(-2, -26); c.closePath(); c.fill();
  c.restore();
}

/* ---------- TENİS ---------- */
function tenis(W, H, bitti){
  // kort: üst/alt boşluk, çizgiler
  const KX0 = W * .12, KX1 = W * .88, KY0 = H * .14, KY1 = H * .88, KW = KX1 - KX0, KH = KY1 - KY0, NET = (KY0 + KY1) / 2;
  const SX0 = KX0 + KW * .12, SX1 = KX1 - KW * .12;          // tekler çizgileri
  const SRV = KH * .27;                                      // servis çizgisi ağdan uzaklığı
  const R = 34, by = KY1 - 6, ty = KY0 + 6;                  // raket erişimi, oyuncu y
  const PUAN = ['0', '15', '30', '40'];
  let px = W / 2, ax = W / 2, sA = 0, sS = 0, bekle = 1.4, hiz = H * .55, hata = 0, bitis = false, mesaj = '', mesajT = 0, t = 0;
  let salA = 0, salS = 0, vurY = 0, hedefY = 0, sekti = false;
  const top = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: 7 };
  function servis(kim){   // kim: 1 = Aysun servis (top yukarı), -1 = Soner
    top.x = kim === 1 ? px : ax; top.y = kim === 1 ? by - 20 : ty + 20; hiz = H * .55;
    const a = (Math.random() - .5) * .6;
    top.vx = Math.sin(a) * hiz; top.vy = -Math.cos(a) * hiz * kim; bekle = 1.2; hata = (Math.random() - .5) * R * 2.2;
    vurY = top.y; hedefY = kim === 1 ? ty : by; sekti = false;
    if (kim === 1) salA = 1; else salS = 1;
  }
  servis(1);
  function puan(aysun){
    if (aysun) sA++; else sS++;
    ses(aysun ? 740 : 220, .25, 'triangle');
    if (sA >= 4){ bitis = true; mesaj = 'Oyun, set ve maç: Aysun! 🏆'; mesajT = 99; ses(880, .6, 'triangle'); bitti(); return; }
    if (sS >= 4){ mesaj = 'Soner: "Bir oyun daha!"'; mesajT = 1.6; sA = sS = 0; }
    servis(aysun ? -1 : 1);
  }
  function yukseklik(){   // top havada: vuruştan hedefe iki yay (arada seker)
    const f = Math.min(1, Math.max(0, (top.y - vurY) / (hedefY - vurY)));
    if (!sekti && f > .5){ sekti = true; ses(900, .04, 'square', .02); }
    return Math.abs(Math.sin(f * Math.PI * 2)) * 34 * (f < .5 ? 1 : .6);
  }
  function oyuncu(c, x, y, ust, sal, renk, sac){
    c.save(); c.translate(x, y);
    const yon = ust ? 1 : -1;
    // gölge
    c.fillStyle = 'rgba(0,0,0,.2)'; c.beginPath(); c.ellipse(0, 8, 18, 6, 0, 0, 7); c.fill();
    // bacaklar
    c.strokeStyle = '#d98c6c'; c.lineWidth = 6; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-6, 0); c.lineTo(-8, 12); c.moveTo(6, 0); c.lineTo(9, 12); c.stroke();
    // etek/şort
    c.fillStyle = renk[1]; c.beginPath(); c.roundRect(-11, -8, 22, 12, 4); c.fill();
    // gövde
    c.fillStyle = renk[0]; c.beginPath(); c.roundRect(-11, -30, 22, 24, 6); c.fill();
    // baş
    c.fillStyle = '#d98c6c'; c.beginPath(); c.arc(0, -40, 9, 0, 7); c.fill();
    c.fillStyle = sac; c.beginPath(); c.arc(0, -43, 9, Math.PI, 0); c.fill();
    if (!ust){ c.beginPath(); c.ellipse(-8, -34, 4, 8, .4, 0, 7); c.fill(); }   // at kuyruğu (Aysun, sırtı bize dönük)
    // kol + raket (vuruşta savrulur)
    const ang = (ust ? .9 : -.9) + Math.sin(sal * Math.PI) * 1.6 * yon;
    c.save(); c.translate(12, -22); c.rotate(ang);
    c.strokeStyle = '#d98c6c'; c.lineWidth = 5; c.beginPath(); c.moveTo(0, 0); c.lineTo(16, 0); c.stroke();
    c.strokeStyle = '#333'; c.lineWidth = 3; c.beginPath(); c.moveTo(16, 0); c.lineTo(24, 0); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.35)'; c.strokeStyle = '#c0392b'; c.lineWidth = 2.5; c.beginPath(); c.ellipse(34, 0, 11, 8, 0, 0, 7); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 1; for (let i = -6; i <= 6; i += 3){ c.beginPath(); c.moveTo(34 + i, -7); c.lineTo(34 + i, 7); c.moveTo(24, i); c.lineTo(44, i); c.stroke(); }
    c.restore(); c.restore();
  }
  return {
    down(x){ px = Math.min(SX1 + 10, Math.max(SX0 - 10, x)); },
    move(x){ px = Math.min(SX1 + 10, Math.max(SX0 - 10, x)); },
    ud(dt){
      t += dt; mesajT -= dt; salA = Math.max(0, salA - dt * 3); salS = Math.max(0, salS - dt * 3);
      if (bitis) return;
      if (bekle > 0){ bekle -= dt; return; }
      const maxHiz = W * (sS > sA ? .22 : .34);
      const hedef = top.vy < 0 ? top.x + hata : W / 2;
      const d = hedef - ax; ax += Math.sign(d) * Math.min(Math.abs(d), maxHiz * dt);
      ax = Math.min(SX1 + 10, Math.max(SX0 - 10, ax));
      top.x += top.vx * dt; top.y += top.vy * dt;
      if (top.x < KX0 - 30){ top.x = KX0 - 30; top.vx = Math.abs(top.vx); }
      if (top.x > KX1 + 30){ top.x = KX1 + 30; top.vx = -Math.abs(top.vx); }
      // Aysun vuruşu
      if (top.vy > 0 && top.y >= by - 26 && top.y <= by + 6 && Math.abs(top.x - px) <= R){
        const o = (top.x - px) / R; hiz = Math.min(H * .95, hiz * 1.06);
        top.vx = o * hiz * .7; top.vy = -Math.sqrt(Math.max(hiz * hiz - top.vx * top.vx, (hiz * .5) ** 2)); top.y = by - 26;
        darbe(320, .1, .3); salA = 1; hata = (Math.random() - .5) * R * 2.6; vurY = top.y; hedefY = ty; sekti = false;
      }
      // Soner vuruşu
      if (top.vy < 0 && top.y <= ty + 26 && top.y >= ty - 6 && Math.abs(top.x - ax) <= R){
        const o = (top.x - ax) / R;
        top.vx = o * hiz * .55; top.vy = Math.sqrt(Math.max(hiz * hiz - top.vx * top.vx, (hiz * .5) ** 2)); top.y = ty + 26;
        darbe(280, .1, .26); salS = 1; vurY = top.y; hedefY = by; sekti = false;
      }
      if (top.y > H + 10) puan(false);
      else if (top.y < -10) puan(true);
    },
    ciz(c){
      // tribün/çevre
      c.fillStyle = '#2d6b3a'; c.fillRect(0, 0, W, H);
      c.fillStyle = 'rgba(0,0,0,.12)'; for (let i = 0; i < 10; i++) c.fillRect(0, i * H / 10, W, H / 20);
      // kort zemini (sert kort mavi)
      c.fillStyle = '#3f7fbf'; c.fillRect(KX0 - 18, KY0 - 18, KW + 36, KH + 36);
      c.fillStyle = '#2f6aa8'; c.fillRect(KX0, KY0, KW, KH);
      // çizgiler
      c.strokeStyle = '#fff'; c.lineWidth = 3; c.lineCap = 'butt';
      c.strokeRect(KX0, KY0, KW, KH);                                   // çiftler
      c.beginPath(); c.moveTo(SX0, KY0); c.lineTo(SX0, KY1); c.moveTo(SX1, KY0); c.lineTo(SX1, KY1); c.stroke();   // tekler
      c.beginPath(); c.moveTo(SX0, NET - SRV); c.lineTo(SX1, NET - SRV); c.moveTo(SX0, NET + SRV); c.lineTo(SX1, NET + SRV); c.stroke();   // servis
      c.beginPath(); c.moveTo(W / 2, NET - SRV); c.lineTo(W / 2, NET + SRV); c.stroke();   // orta servis
      c.beginPath(); c.moveTo(W / 2, KY0); c.lineTo(W / 2, KY0 + 8); c.moveTo(W / 2, KY1); c.lineTo(W / 2, KY1 - 8); c.stroke();
      // ağ
      c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(KX0 - 22, NET + 2, KW + 44, 6);
      c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1;
      for (let x = KX0 - 22; x <= KX1 + 22; x += 6){ c.beginPath(); c.moveTo(x, NET - 6); c.lineTo(x, NET + 6); c.stroke(); }
      for (let y = NET - 6; y <= NET + 6; y += 4){ c.beginPath(); c.moveTo(KX0 - 22, y); c.lineTo(KX1 + 22, y); c.stroke(); }
      c.fillStyle = '#eee'; c.fillRect(KX0 - 22, NET - 8, KW + 44, 3);
      c.fillStyle = '#333'; c.fillRect(KX0 - 26, NET - 12, 6, 24); c.fillRect(KX1 + 20, NET - 12, 6, 24);   // direkler
      // oyuncular
      oyuncu(c, ax, ty, true, salS, ['#3d6fb5', '#1f3f6f'], '#2b1a0c');
      oyuncu(c, px, by, false, salA, ['#e2613f', '#f4e1c1'], '#e6c46a');
      yazi(c, 'Soner', ax, ty - 62, 13); yazi(c, AYAR.isim, px, by + 30, 13);
      // top + gölge
      const z = bekle > 0 ? 0 : yukseklik();
      c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(top.x + 3, top.y + 4, 6, 3.5, 0, 0, 7); c.fill();
      c.fillStyle = '#dfe83a'; c.beginPath(); c.arc(top.x, top.y - z, top.r, 0, 7); c.fill();
      c.strokeStyle = '#fff'; c.lineWidth = 1.2; c.beginPath(); c.arc(top.x, top.y - z, top.r - 2, .5, 2.3); c.stroke();
      // skor tabelası
      c.fillStyle = 'rgba(0,0,0,.55)'; c.beginPath(); c.roundRect(W / 2 - 92, H - 48, 184, 36, 8); c.fill();
      yazi(c, `${AYAR.isim}  ${PUAN[Math.min(sA, 3)]}  -  ${PUAN[Math.min(sS, 3)]}  Soner`, W / 2, H - 30, 16, '#ffe08a');
      if (mesajT > 0) yazi(c, mesaj, W / 2, NET - 40, 22, '#ffe08a');
      else if (bekle > 0) yazi(c, top.vy < 0 ? 'Aysun servis' : 'Soner servis', W / 2, NET - 40, 18, '#fff');
    }
  };
}

/* ===================== KEMENÇE (sentez) ===================== */
const KEMENCE = (() => {
  const VURUS = .36;                                  // 1 vuruş (sn) ~167 bpm
  const D = 293.66, E = 329.63, F = 349.23, G = 392, A = 440, Bb = 466.16, C = 523.25, D2 = 587.33;
  // 16'lık notalar, 2 ölçü x 8 vuruş = 32 adım (0 = sus)
  const EZGI = [
    A, A, G, A,  Bb, A, G, F,  G, G, F, G,  A, G, F, E,
    F, G, A, A,  Bb, C, Bb, A,  G, A, G, F,  E, F, E, D,
    A, C, A, G,  A, Bb, A, G,  F, G, A, G,  F, E, F, G,
    A, A, Bb, A,  G, F, E, F,  G, F, E, D,  D, 0, D, 0
  ];
  let timer = 0, adimI = 0, sonraki = 0, drone = null, master = null, dosya = null, dosyaHata = false;
  try {
    dosya = new Audio(AYAR.kemence); dosya.loop = true; dosya.preload = 'auto';
    dosya.addEventListener('error', () => dosyaHata = true);
  } catch (e) { dosyaHata = true; }
  function nota(f, t0, sure, vur){
    const o = AC.createOscillator(), o2 = AC.createOscillator(), bp = AC.createBiquadFilter(), lp = AC.createBiquadFilter(), g = AC.createGain(), lfo = AC.createOscillator(), lg = AC.createGain();
    o.type = 'sawtooth'; o2.type = 'sawtooth'; o.frequency.value = f; o2.frequency.value = f * 1.004;
    bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = .9;
    lp.type = 'lowpass'; lp.frequency.value = 3800;
    lfo.frequency.value = 6.5; lg.gain.value = f * .012; lfo.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency);
    o.connect(bp); o2.connect(bp); bp.connect(lp); lp.connect(g); g.connect(master);
    const v = vur ? .16 : .11;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + .018); g.gain.setValueAtTime(v, t0 + sure - .03); g.gain.linearRampToValueAtTime(.0001, t0 + sure);
    o.start(t0); o2.start(t0); lfo.start(t0); o.stop(t0 + sure + .02); o2.stop(t0 + sure + .02); lfo.stop(t0 + sure + .02);
  }
  function davul(t0, tok){
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.setValueAtTime(tok ? 160 : 110, t0); o.frequency.exponentialRampToValueAtTime(45, t0 + .12);
    g.gain.setValueAtTime(tok ? .12 : .22, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + .16);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + .2);
  }
  function planla(){
    while (sonraki < AC.currentTime + .25){
      const f = EZGI[adimI % EZGI.length], on16 = adimI % 4, adim = VURUS / 4;
      if (f) nota(f, sonraki, adim * (on16 === 0 ? 1.15 : .95), on16 === 0);
      if (on16 === 0) davul(sonraki, (adimI / 4) % 2 === 1);
      adimI++; sonraki += adim;
    }
  }
  return {
    basla(){
      if (!sesAcik) return;
      if (dosya && !dosyaHata){
        try { dosya.currentTime = 0; dosya.volume = .85; const pr = dosya.play(); if (pr && pr.catch) pr.catch(() => this.sentez()); return; } catch (e) {}
      }
      this.sentez();
    },
    sentez(){
      try {
        AC = AC || new (window.AudioContext || window.webkitAudioContext)();
        if (AC.state === 'suspended') AC.resume();
        master = AC.createGain(); master.gain.value = .55; master.connect(AC.destination);
        drone = AC.createOscillator(); const dg = AC.createGain(), dl = AC.createBiquadFilter();
        drone.type = 'sawtooth'; drone.frequency.value = D / 2; dl.type = 'lowpass'; dl.frequency.value = 500; dg.gain.value = .05;
        drone.connect(dl); dl.connect(dg); dg.connect(master); drone.start();
        adimI = 0; sonraki = AC.currentTime + .05; planla(); timer = setInterval(planla, 90);
      } catch (e) {}
    },
    dur(){
      clearInterval(timer); timer = 0;
      try { dosya && dosya.pause(); } catch (e) {}
      if (master){ const m = master; m.gain.setTargetAtTime(0, AC.currentTime, .15); setTimeout(() => { try { drone.stop(); m.disconnect(); } catch (e) {} }, 600); master = null; drone = null; }
    },
    VURUS
  };
})();

/* ---------- HORON ---------- */
function horon(W, H, bitti){
  const V = KEMENCE.VURUS, SURE = V * 3, NOTALAR = [392, 440, 523, 587, 659, 587, 523, 440];
  KEMENCE.basla();
  let t = 0, hit = 0, cikan = 0, sonraki = V * 2, hed = [], pop = [], bitis = false, tur = 1, nk = 0;
  const kalan = () => hed.filter(h => !h.ok && !h.gitti).length;
  return {
    down(x, y){
      if (bitis) return;
      let en = null, ed = 70;
      for (const h of hed) if (!h.ok && !h.gitti){ const d = Math.hypot(h.x - x, h.y - y); if (d < ed){ ed = d; en = h; } }
      if (!en) return;
      const yas = t - en.t0; en.ok = true; hit++;
      const iyi = Math.abs(yas - SURE) < .22;
      pop.push({ x: en.x, y: en.y, m: iyi ? 'Harika!' : 'İyi', t: 0 });
      ses(NOTALAR[nk++ % NOTALAR.length], .15, 'triangle', .04);
      if (hit >= 8 && !bitis){ bitis = true; ses(880, .5, 'triangle'); setTimeout(() => KEMENCE.dur(), 1800); setTimeout(bitti, 400); }
    },
    ud(dt){
      t += dt;
      pop.forEach(p => p.t += dt); pop = pop.filter(p => p.t < .8);
      hed.forEach(h => { if (!h.ok && !h.gitti && t - h.t0 > SURE + .35) h.gitti = true; });
      hed = hed.filter(h => t - h.t0 < SURE + 1);
      if (bitis) return;
      if (t >= sonraki && cikan < tur * 12 - (tur - 1) * 6 + (tur > 1 ? 0 : 0)){
        hed.push({ x: W * .18 + Math.random() * W * .64, y: H * .22 + Math.random() * H * .42, t0: t, ok: false, gitti: false });
        cikan++; sonraki += V * 2;
      } else if (t >= sonraki && kalan() === 0 && hit < 8){ tur++; sonraki += V * 2; cikan -= 6; }
    },
    ciz(c){
      const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#f6b26b'); g.addColorStop(.55, '#e07a5f'); g.addColorStop(1, '#3d405b');
      c.fillStyle = g; c.fillRect(0, 0, W, H);
      c.fillStyle = '#2f5d4a'; c.beginPath(); c.moveTo(0, H * .7); c.quadraticCurveTo(W * .3, H * .55, W * .55, H * .68); c.quadraticCurveTo(W * .8, H * .58, W, H * .66); c.lineTo(W, H); c.lineTo(0, H); c.fill();
      c.fillStyle = '#244a3a'; c.beginPath(); c.moveTo(0, H * .8); c.quadraticCurveTo(W * .5, H * .68, W, H * .8); c.lineTo(W, H); c.lineTo(0, H); c.fill();
      // dansçılar
      const tempo = Math.PI / V;
      for (let i = 0; i < 7; i++){
        const x = W * (.1 + i * .13), ySal = Math.abs(Math.sin(t * tempo + i)) * 12;
        c.font = '34px serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(i % 2 ? '🕺' : '💃', x, H * .88 - ySal);
      }
      c.font = '40px serif'; c.fillText('🪕', W * .5, H * .76 + Math.sin(t * tempo) * 4);
      // hedefler
      for (const h of hed){
        const yas = t - h.t0;
        if (h.ok){ c.strokeStyle = 'rgba(120,255,160,.9)'; c.lineWidth = 5; c.beginPath(); c.arc(h.x, h.y, 38, 0, 7); c.stroke(); continue; }
        if (h.gitti) continue;
        c.fillStyle = 'rgba(255,255,255,.22)'; c.beginPath(); c.arc(h.x, h.y, 38, 0, 7); c.fill();
        c.strokeStyle = '#fff'; c.lineWidth = 4; c.beginPath(); c.arc(h.x, h.y, 38, 0, 7); c.stroke();
        const r = 38 + 62 * Math.max(0, 1 - yas / SURE);
        c.strokeStyle = yas > SURE - .2 && yas < SURE + .2 ? '#7dffa0' : '#ffe08a'; c.lineWidth = 5; c.beginPath(); c.arc(h.x, h.y, r, 0, 7); c.stroke();
        c.font = '28px serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('🎶', h.x, h.y);
      }
      pop.forEach(p => yazi(c, p.m, p.x, p.y - 50 - p.t * 40, 20, '#fff'));
      yazi(c, `${Math.min(hit, 8)}/8`, W / 2, 96 + 0, 28, '#ffe08a');
      if (bitis) yazi(c, 'Horon tamam! 💃', W / 2, H * .45, 28, '#fff');
    }
  };
}

/* ---------- YÜZME ---------- */
function yuzme(W, H, bitti){
  const laneX = i => W * (.22 + .28 * i), SY = H * .76, TOPLAM = 26;
  let lane = 1, x = laneX(1), ilerle = 0, yavas = 0, sp = .6, engel = [], kabarcik = [], t = 0, bitis = false, sars = 0, sonSerit = -1;
  function yuzucu(c, t){
    // üstten görünüm, kıyıya (yukarı) doğru serbest stil kulaç
    const p = t * 7, TEN = '#e8b48a', SAC = '#e6c46a', BIK = '#e2453f';
    const ka = Math.sin(p), kb = Math.sin(p + Math.PI);
    c.lineCap = 'round'; c.lineJoin = 'round';
    // su köpüğü (ayak ve el)
    c.fillStyle = 'rgba(255,255,255,.45)';
    c.beginPath(); c.arc(-6 + ka * 3, 42, 5 + Math.abs(ka) * 3, 0, 7); c.arc(6 + kb * 3, 40, 5 + Math.abs(kb) * 3, 0, 7); c.fill();
    // bacaklar (çırpma)
    c.strokeStyle = TEN; c.lineWidth = 8;
    c.beginPath(); c.moveTo(-6, 14); c.lineTo(-7, 30 + ka * 4); c.lineTo(-6 + ka * 3, 44); c.stroke();
    c.beginPath(); c.moveTo(6, 14); c.lineTo(7, 30 + kb * 4); c.lineTo(6 + kb * 3, 44); c.stroke();
    // gövde
    c.fillStyle = TEN; c.beginPath(); c.moveTo(-13, -14); c.lineTo(13, -14); c.quadraticCurveTo(12, 4, 10, 16); c.lineTo(-10, 16); c.quadraticCurveTo(-12, 4, -13, -14); c.fill();
    // bikini alt + üst (sırttan bağcık)
    c.fillStyle = BIK; c.beginPath(); c.moveTo(-10, 8); c.lineTo(10, 8); c.lineTo(8, 17); c.lineTo(-8, 17); c.fill();
    c.strokeStyle = BIK; c.lineWidth = 3; c.beginPath(); c.moveTo(-12, -8); c.lineTo(12, -8); c.stroke();
    c.beginPath(); c.moveTo(-7, -14); c.lineTo(-3, -22); c.moveTo(7, -14); c.lineTo(3, -22); c.stroke();
    // kollar: biri ileri uzanır, diğeri suyu çeker
    c.strokeStyle = TEN; c.lineWidth = 7;
    const kol = (sx, f) => {   // f: 0..1 döngü
      const ang = f * Math.PI * 2;

/* ---------- KURTARMA (Selin) ---------- */

      if (!kurtuldu){ c.strokeStyle = 'rgba(200,220,255,.45)'; c.lineWidth = 1.5; yag.forEach(y => { c.beginPath(); c.moveTo(y.x, y.y); c.lineTo(y.x + 6, y.y - 18); c.stroke(); }); }

      gemiCiz(c, sx, H - 90 + Math.sin(t * 2.5) * 4, 1, 1.25);

}


/* ---------- REFORMER (aletli pilates) ---------- */
function denge(W, H, bitti){
  const HEDEF = 8, FAZ = 1.7;                 // her faz 1.7 sn: İT / ÇEK
  let t = 0, bas = false, k = 0, kv = 0, tekrar = 0, faz = 0, fazT = 0, dogru = 0, bitis = false, mesaj = '', mesajT = 0;

      kv += ((hedefK - k) * 12 - kv * 5) * dt; k = Math.min(1, Math.max(0, k + kv * dt));

        } else { mesaj = faz === 0 ? 'Basılı tut, kızağı aç' : 'Bırak, yaylar getirsin'; mesajT = 1.2; }
        faz = 1 - faz; fazT = 0; dogru = 0;

      const ZY = H * .6;

      c.strokeStyle = '#fff'; c.lineWidth = 5; c.beginPath(); c.roundRect(px0, py0, pw, ph, 8); c.moveTo(px0 + pw / 2, py0); c.lineTo(px0 + pw / 2, py0 + ph); c.moveTo(px0, py0 + ph / 2); c.lineTo(px0 + pw, py0 + ph / 2); c.stroke();
      // bitki

      c.fillStyle = '#c47f5a'; c.beginPath(); c.moveTo(bx - 16, byy); c.lineTo(bx + 16, byy); c.lineTo(bx + 12, byy - 30); c.lineTo(bx - 12, byy - 30); c.fill();
      c.strokeStyle = '#3f8a5c'; c.lineWidth = 4; for (let i = -2; i <= 2; i++){ c.beginPath(); c.moveTo(bx, byy - 30); c.quadraticCurveTo(bx + i * 14, byy - 60, bx + i * 22, byy - 78 + Math.abs(i) * 8); c.stroke(); }
      // reformer çerçevesi
      const x0 = W * .17, x1 = W * .95, L = x1 - x0, fy = ZY - 78;
      c.fillStyle = 'rgba(0,0,0,.08)'; c.beginPath(); c.ellipse((x0 + x1) / 2, ZY + 6, L * .52, 8, 0, 0, 7); c.fill();
      c.fillStyle = '#8b5e3c'; c.beginPath(); c.roundRect(x0 + 10, fy + 14, 14, ZY - fy - 14, 3); c.roundRect(x1 - 24, fy + 14, 14, ZY - fy - 14, 3); c.fill();   // ayaklar
      c.fillStyle = '#a9754a'; c.beginPath(); c.roundRect(x0, fy, L, 18, 5); c.fill();                                       // ahşap gövde
      c.fillStyle = 'rgba(255,255,255,.18)'; c.fillRect(x0 + 4, fy + 3, L - 8, 4);
      c.fillStyle = '#9a9a9a'; c.fillRect(x0 + 6, fy - 3, L - 12, 3);                                                          // ray
      // ayak barı (sağ uçta kavisli)
      c.strokeStyle = '#8f8f8f'; c.lineWidth = 6; c.beginPath(); c.moveTo(x1 - 30, fy); c.quadraticCurveTo(x1 - 30, fy - 52, x1 - 6, fy - 62); c.stroke();
      c.strokeStyle = '#2b2b2b'; c.lineWidth = 9; c.beginPath(); c.moveTo(x1 - 22, fy - 62); c.lineTo(x1 + 2, fy - 62); c.stroke();
      // kızak (sola gider = it)

      c.fillStyle = '#2b2b2b'; c.beginPath(); c.roundRect(kx, fy - 26, kw, 24, 6); c.fill();
      c.fillStyle = '#3f6b8f'; c.beginPath(); c.roundRect(kx + 4, fy - 30, kw - 8, 10, 5); c.fill();                        // döşeme
      c.fillStyle = '#5b8fb8'; c.beginPath(); c.roundRect(kx + 8, fy - 36, 34, 8, 4); c.fill();                              // başlık
      c.fillStyle = '#1e1e1e'; c.beginPath(); c.roundRect(kx + 36, fy - 40, 8, 12, 3); c.fill();   // omuz bloğu (başın hemen altında)

      const hx = kx + kw - 30, hy = fy - 34, fx = x1 - 12, fyy = fy - 64;
      const T = 46, S = 46, d = Math.hypot(fx - hx, fyy - hy), dd = Math.min(d, T + S - 1);
      const ang = Math.atan2(fyy - hy, fx - hx), cosA = (T * T + dd * dd - S * S) / (2 * T * dd), a1 = ang - Math.acos(Math.max(-1, Math.min(1, cosA)));

      c.strokeStyle = '#1b3340'; c.lineWidth = 12; c.beginPath(); c.moveTo(hx - 3, hy - 4); c.lineTo(knx - 3, kny - 6); c.lineTo(fx - 2, fyy - 4); c.stroke();

      c.fillStyle = UST; c.beginPath(); c.roundRect(kx + 44, fy - 44, 44, 14, 7); c.fill();                          // spor üst
      c.fillStyle = TAYT; c.beginPath(); c.roundRect(hx - 22, fy - 44, 28, 14, 7); c.fill();                          // tayt kalça
      c.strokeStyle = TAYT; c.lineWidth = 12; c.beginPath(); c.moveTo(hx, hy); c.lineTo(knx, kny); c.lineTo(fx, fyy); c.stroke();
      c.strokeStyle = '#8a7a9a'; c.lineWidth = 6; c.beginPath(); c.moveTo(fx - 2, fyy + 3); c.lineTo(fx + 6, fyy + 3); c.stroke();  // ayak (çorap)
      c.strokeStyle = TEN; c.lineWidth = 7; c.beginPath(); c.moveTo(kx + 56, fy - 36); c.lineTo(kx + 84, fy - 32); c.lineTo(kx + 104, fy - 30); c.stroke();  // kol
      // baş + saç (topuz)
      c.fillStyle = TEN; c.beginPath(); c.arc(kx + 22, fy - 46, 11, 0, 7); c.fill();
      c.fillStyle = SAC; c.beginPath(); c.arc(kx + 20, fy - 49, 11.5, Math.PI * .8, Math.PI * 1.85); c.fill();
      c.beginPath(); c.arc(kx + 9, fy - 44, 6, 0, 7); c.fill();
      c.fillStyle = '#222'; c.beginPath(); c.arc(kx + 27, fy - 48, 1.4, 0, 7); c.fill();

      for (let i = 0; i < HEDEF; i++){ c.fillStyle = i < tekrar ? '#2a9d8f' : 'rgba(0,0,0,.15)'; c.beginPath(); c.arc(W * .7 - (HEDEF - 1) * 9 + i * 18, H * .2, 6, 0, 7); c.fill(); }

/* ---------- PARKUR (at) ---------- */
function parkur(W, H, bitti){
  const YER = H * .74, HX = W * .3, TOPLAM = /[?&]hizli/.test(location.search) ? 3 : 24, HIZ = W * .55;
  let t = 0, y = 0, vy = 0, yavas = 0, ilerle = 0, engel = [], sp = 1.6, bitis = false, sars = 0, zemin = 0, atlama = 0, faz = 0, fazT = 0, kalp = [];
  const agac = []; for (let i = 0; i < 7; i++) agac.push({ x: Math.random() * W * 2, h: 40 + Math.random() * 40, tip: i % 3 });
  const bulut = []; for (let i = 0; i < 4; i++) bulut.push({ x: Math.random() * W, y: 40 + Math.random() * 90, r: 22 + Math.random() * 18 });
  return {
    down(){
      if (bitis && faz === 1 && y <= 0){ faz = 2; fazT = 0; return; }
      if (y <= 0 && !bitis){ vy = H * 1.15; atlama = 1; ses(520, .1, 'triangle', .05); }
    },
    ud(dt){
      t += dt; sars = Math.max(0, sars - dt); fazT += dt;
      if (bitis){
        if (y > 0){ vy -= H * 3.2 * dt; y = Math.max(0, y + vy * dt); zemin += dt * HIZ; if (y === 0){ vy = 0; darbe(110, .1, .5, 2); } }
        if (faz === 2 && Math.random() < dt * 4) kalp.push({ x: HX - 20 + Math.random() * 60, y: YER - 100, t: 0 });
        kalp.forEach(k => { k.t += dt; k.y -= 40 * dt; }); kalp = kalp.filter(k => k.t < 1.6);
        if (faz === 2 && fazT > 3.4){ faz = 3; bitti(); }
        return;
      }
      vy -= H * 3.2 * dt; y += vy * dt; if (y < 0){ y = 0; vy = 0; atlama = 0; }
      const v = (yavas > 0 ? .5 : 1); yavas = Math.max(0, yavas - dt);
      const phO = (zemin / 26 * 1.1) % (Math.PI * 2);
      ilerle += dt / TOPLAM * v; zemin += dt * HIZ * v;
      const phN = (zemin / 26 * 1.1) % (Math.PI * 2);
      if (y <= 0) for (const p of [0.2, 0.9, 1.5, 2.1]) if ((phO < p && phN >= p) || (phN < phO && p <= phN)) darbe(110 + Math.random() * 40, .1, .6, 2.2);
      sp -= dt * v;
      if (sp <= 0 && ilerle < .88){ engel.push({ x: W + 60, h: 44 + Math.random() * 26, vuruldu: false }); sp = 1.7 + Math.random() * .9; }
      for (const o of engel){
        o.x -= HIZ * v * dt;
        if (!o.vuruldu && Math.abs(o.x - HX) < 34 && y < o.h - 6){ o.vuruldu = true; yavas = 1.1; sars = .5; ses(150, .25, 'sawtooth', .05); }
      }
      engel = engel.filter(o => o.x > -80);
      agac.forEach(a => { a.x -= HIZ * v * dt * .35; if (a.x < -60) a.x += W * 2 + 60; });
      bulut.forEach(b => { b.x -= 12 * dt; if (b.x < -60) b.x = W + 60; });
      if (ilerle >= 1){ bitis = true; faz = 1; fazT = 0; ses(880, .5, 'triangle'); }
    },
